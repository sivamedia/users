server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~* \.(js|mjs|json|css|map|woff2?)$ {
        add_header Access-Control-Allow-Origin "*" always;
    }
}
